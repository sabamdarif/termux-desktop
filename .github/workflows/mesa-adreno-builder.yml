name: Build Mesa Adreno (Turnip + Fryzek's KGSL)
on:
    push:
        paths:
            - ".github/workflows/mesa-adreno-builder.yml"
            - ".github/scripts/mesa-adreno.sh"
    pull_request:
        paths:
            - ".github/workflows/mesa-adreno-builder.yml"
            - ".github/scripts/mesa-adreno.sh"
    workflow_dispatch:
        inputs:
            mesa_adreno_tag:
                description: "lfdevs/mesa-for-android-container tag to build, e.g. mesa-26.3.0-devel-20260824 (REQUIRED - no default)"
                required: true
                type: string
            action_type:
                description: "Choose action to perform"
                required: true
                default: "release"
                type: choice
                options:
                    - release
                    - build_only

permissions:
    contents: write

jobs:
    validate-inputs:
        runs-on: ubuntu-latest
        outputs:
            mesa_adreno_tag: ${{ steps.validate.outputs.mesa_adreno_tag }}
            mesa_adreno_version: ${{ steps.validate.outputs.mesa_adreno_version }}
            action_type: ${{ steps.validate.outputs.action_type }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Validate tag
              id: validate
              run: |
                  if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
                    # For push/PR events, extract the pin from enable-hw-acceleration
                    MESA_ADRENO_VERSION=$(grep -oP 'MESA_ADRENO_VERSION="\K[^"]+' enable-hw-acceleration 2>/dev/null || echo "")
                    if [ -z "$MESA_ADRENO_VERSION" ]; then
                      echo "ERROR: Could not extract MESA_ADRENO_VERSION from enable-hw-acceleration"
                      exit 1
                    fi
                    MESA_ADRENO_TAG="mesa-${MESA_ADRENO_VERSION}"
                    ACTION_TYPE="build_only"
                    echo "Auto-triggered build — detected tag: $MESA_ADRENO_TAG"
                  else
                    MESA_ADRENO_TAG="${{ github.event.inputs.mesa_adreno_tag }}"
                    if [ -z "$MESA_ADRENO_TAG" ]; then
                      echo "ERROR: mesa_adreno_tag is required but not provided"
                      exit 1
                    fi
                    case "$MESA_ADRENO_TAG" in
                      mesa-*) ;;
                      turnip-*)
                        echo "ERROR: turnip-* tags only carry the Turnip driver, they don't have"
                        echo "       the KGSL gallium driver in them. Use a mesa-* tag."
                        exit 1
                        ;;
                      *)
                        echo "ERROR: expected a mesa-* tag, got: $MESA_ADRENO_TAG"
                        exit 1
                        ;;
                    esac
                    MESA_ADRENO_VERSION="${MESA_ADRENO_TAG#mesa-}"
                    ACTION_TYPE="${{ github.event.inputs.action_type }}"
                  fi
                  echo "mesa_adreno_tag=$MESA_ADRENO_TAG" >> $GITHUB_OUTPUT
                  echo "mesa_adreno_version=$MESA_ADRENO_VERSION" >> $GITHUB_OUTPUT
                  echo "action_type=$ACTION_TYPE" >> $GITHUB_OUTPUT
                  echo "Using tag: $MESA_ADRENO_TAG (version $MESA_ADRENO_VERSION)"
                  echo "Action type: $ACTION_TYPE"

    build-ubuntu-arm64:
        needs: validate-inputs
        runs-on: ubuntu-24.04-arm
        strategy:
            matrix:
                arch: [aarch64, arm]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up QEMU for ARM32
              if: matrix.arch == 'arm'
              uses: docker/setup-qemu-action@v4
              with:
                  platforms: arm

            - name: Install dependencies (ARM64 native)
              if: matrix.arch == 'aarch64'
              run: |
                  sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
                  sudo apt update
                  sudo apt build-dep -y mesa
                  sudo apt install -y \
                    git ccache \
                    clang clang-tools llvm llvm-dev \
                    ninja-build patchelf unzip curl \
                    python3-pip python3-mako flex bison \
                    zip cmake glslang-tools

                  # Upgrade meson to latest version
                  sudo apt remove -y meson || true
                  sudo pip3 install --upgrade meson --break-system-packages

                  # Verify meson version
                  echo "Installed Meson version:"
                  meson --version

            - name: Install Docker (for ARM32 QEMU build)
              if: matrix.arch == 'arm'
              run: |
                  # Docker should already be available on ubuntu-24.04-arm runner
                  docker --version

            - name: Cache ccache (ARM64)
              if: matrix.arch == 'aarch64'
              uses: actions/cache@v6
              with:
                  path: ~/.ccache
                  key: ccache-mesa-adreno-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      ccache-mesa-adreno-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-

            - name: Cache ccache (ARM32)
              if: matrix.arch == 'arm'
              uses: actions/cache@v6
              with:
                  path: ./.ccache-arm32
                  key: ccache-mesa-adreno-arm32-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      ccache-mesa-adreno-arm32-

            - name: Configure ccache (ARM64)
              if: matrix.arch == 'aarch64'
              run: |
                  export CCACHE_DIR=~/.ccache
                  ccache --max-size=2G
                  ccache --show-config
                  ccache --zero-stats
                  ccache --show-stats

            - name: Build for ${{ matrix.arch }}
              env:
                  MESA_ADRENO_TAG: ${{ needs.validate-inputs.outputs.mesa_adreno_tag }}
                  CCACHE_DIR: ~/.ccache
              run: |
                  cd .github/scripts
                  chmod +x mesa-adreno.sh
                  MESA_ADRENO_TAG="${MESA_ADRENO_TAG}" ./mesa-adreno.sh ${{ matrix.arch }}

            - name: Show ccache stats (ARM64)
              if: matrix.arch == 'aarch64'
              run: |
                  export CCACHE_DIR=~/.ccache
                  ccache --show-stats

            - name: Show ccache stats (ARM32)
              if: matrix.arch == 'arm'
              run: |
                  if [ -d ./.ccache-arm32 ]; then
                    du -sh ./.ccache-arm32
                  fi

            - name: Save ccache (ARM64)
              if: matrix.arch == 'aarch64'
              uses: actions/cache/save@v6
              with:
                  path: ~/.ccache
                  key: ccache-mesa-adreno-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

            - name: Save ccache (ARM32)
              if: matrix.arch == 'arm'
              uses: actions/cache/save@v6
              with:
                  path: ./.ccache-arm32
                  key: ccache-mesa-adreno-arm32-${{ github.run_id }}-${{ github.run_attempt }}

            - name: Upload ${{ matrix.arch }} artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: mesa-adreno-${{ needs.validate-inputs.outputs.mesa_adreno_version }}-${{ matrix.arch }}
                  path: .github/scripts/mesa_adreno_workdir/mesa-adreno-${{ needs.validate-inputs.outputs.mesa_adreno_version }}-${{ matrix.arch }}.zip
                  retention-days: 30

            - name: Cleanup build directory
              if: always()
              run: |
                  # Use sudo to remove files created by Docker (owned by root)
                  if [ -d .github/scripts/mesa_adreno_workdir ]; then
                    sudo rm -rf .github/scripts/mesa_adreno_workdir
                  fi

    create-release:
        needs: [validate-inputs, build-ubuntu-arm64]
        if: needs.validate-inputs.outputs.action_type == 'release'
        runs-on: ubuntu-24.04-arm
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Download all artifacts
              uses: actions/download-artifact@v8
              with:
                  path: ./artifacts

            - name: Build release notes with checksums
              shell: bash
              run: |
                  set -euo pipefail

                  VERSION="${{ needs.validate-inputs.outputs.mesa_adreno_version }}"
                  TAG="${{ needs.validate-inputs.outputs.mesa_adreno_tag }}"

                  echo "## Mesa Adreno ${VERSION} - Turnip + Fryzek's KGSL" > release_body.md
                  echo "" >> release_body.md
                  echo "Built from [lfdevs/mesa-for-android-container](https://github.com/lfdevs/mesa-for-android-container) at \`${TAG}\`" >> release_body.md
                  echo "" >> release_body.md
                  echo "One build for the Linux container that carry both the native Adreno Vulkan driver (Turnip) and the native Adreno OpenGL driver (Fryzek's KGSL). It install under \`/opt/mesa-adreno\` so nothing the distro owns get overwritten, and it works on any distro." >> release_body.md
                  echo "" >> release_body.md
                  echo "Built for Android ARM64 and ARM32 architectures" >> release_body.md
                  echo "" >> release_body.md
                  echo "### Checksums" >> release_body.md
                  echo '```plaintext' >> release_body.md

                  find ./artifacts -name "*.zip" -type f -exec sha256sum {} \; | \
                    awk '{print $1 "  " $2}' | \
                    sed 's|./artifacts/[^/]*/||' | \
                    sort -k2,2 >> release_body.md

                  echo '```' >> release_body.md

                  cat release_body.md

            - name: Validate artifacts exist
              run: |
                  VERSION="${{ needs.validate-inputs.outputs.mesa_adreno_version }}"
                  AARCH64_ARTIFACT="./artifacts/mesa-adreno-${VERSION}-aarch64/mesa-adreno-${VERSION}-aarch64.zip"
                  ARM_ARTIFACT="./artifacts/mesa-adreno-${VERSION}-arm/mesa-adreno-${VERSION}-arm.zip"

                  echo "Checking for required artifacts..."
                  for artifact in "$AARCH64_ARTIFACT" "$ARM_ARTIFACT"; do
                    if [ ! -f "$artifact" ]; then
                      echo "ERROR: artifact not found: $artifact"
                      echo "Available files in ./artifacts/:"
                      find ./artifacts/ -type f || true
                      exit 1
                    fi
                    echo "✅ $artifact ($(ls -lh "$artifact" | awk '{print $5}'))"
                  done

            - name: Update the pin in enable-hw-acceleration
              run: |
                  VERSION="${{ needs.validate-inputs.outputs.mesa_adreno_version }}"
                  sed -i "s/MESA_ADRENO_VERSION=\"[^\"]*\"/MESA_ADRENO_VERSION=\"${VERSION}\"/g" enable-hw-acceleration
                  grep "MESA_ADRENO_VERSION" enable-hw-acceleration

            - name: Commit and push version update
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "GitHub Action"
                  git add enable-hw-acceleration
                  git commit -m "bump(mesa-adreno): ${{ needs.validate-inputs.outputs.mesa_adreno_version }}" || exit 0
                  git push

            - name: Create Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: mesa-adreno-${{ needs.validate-inputs.outputs.mesa_adreno_version }}
                  name: Mesa Adreno ${{ needs.validate-inputs.outputs.mesa_adreno_version }}
                  body_path: release_body.md
                  draft: false
                  prerelease: false
                  make_latest: true
                  files: |
                      ./artifacts/mesa-adreno-${{ needs.validate-inputs.outputs.mesa_adreno_version }}-aarch64/mesa-adreno-${{ needs.validate-inputs.outputs.mesa_adreno_version }}-aarch64.zip
                      ./artifacts/mesa-adreno-${{ needs.validate-inputs.outputs.mesa_adreno_version }}-arm/mesa-adreno-${{ needs.validate-inputs.outputs.mesa_adreno_version }}-arm.zip
